[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dexterity"]

[project]
name = "dexterity-challenge"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx[http2]>=0.27",
    "pydantic>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "comfree_warp",
]

[project.optional-dependencies]
mock-server = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "numpy>=1.26",
]

[tool.uv.sources]
comfree_warp = { workspace = true }

[tool.uv.workspace]
members = ["comfree_warp"]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "pytest-cov>=5.0",
    "fastapi>=0.111",
    "anyio>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["integration: marks tests as integration tests"]

