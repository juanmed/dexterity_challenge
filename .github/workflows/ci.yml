name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Update Submodules
        run: git submodule update --init --recursive

      - name: Setup UV
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Run Tests
        run: |
          uv run pytest --ignore=comfree_warp
